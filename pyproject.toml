[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mathsteps"
dynamic = ["version"]
description = "A step-by-step symbolic/numerical math solver. Linear algebra, root finding, IVPs, BVPs - every step explained, every answer verified."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "math", "step-by-step", "solver", "symbolic", "numerical",
    "linear-algebra", "root-finding", "ode", "bvp", "cli", "education",
]
authors = [{ name = "Debojit Basak" }, { name = "Tonni Rani Dey" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "sympy>=1.12",
    "typer>=0.15.4",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/Stacktern/mathSteps"
Repository = "https://github.com/Stacktern/mathSteps"
Issues = "https://github.com/Stacktern/mathSteps/issues"
Changelog = "https://github.com/Stacktern/mathSteps/blob/main/CHANGELOG.md"

[project.scripts]
mathsteps = "mathsteps.cli:app"

[tool.setuptools.dynamic]
version = { attr = "mathsteps.__version__" }

[tool.setuptools.packages.find]
include = ["mathsteps*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
mathsteps = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:mpmath.*",
]
